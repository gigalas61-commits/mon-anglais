<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E7C7B">
<title>Mon Anglais — Vocabulaire & Conjugaison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface2:#FFFCF6;
  --ink:#232B33; --muted:#6E7C8C; --faint:#9AA6B2;
  --teal:#0E7C7B; --teal-d:#0A5E5D; --teal-soft:#E3F1F0;
  --coral:#EE6240; --coral-soft:#FCEAE3;
  --amber:#F2B441; --amber-soft:#FCF1D8;
  --line:#ECE4D6; --line2:#E4DCCB;
  --shadow:0 1px 2px rgba(35,43,51,.05), 0 6px 18px rgba(35,43,51,.06);
  --shadow-lg:0 8px 30px rgba(35,43,51,.12);
  --r:18px; --r-sm:12px;
  --disp:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:920px; margin:0 auto; padding:0 14px}

/* HEADER */
header.top{
  position:sticky; top:0; z-index:50; background:var(--bg);
  padding-top:calc(env(safe-area-inset-top) + 10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:10px; padding:2px 0 10px}
.brand h1{
  font-family:var(--disp); font-weight:700; font-size:24px; margin:0;
  letter-spacing:-.01em; color:var(--teal-d);
}
.brand .dot{color:var(--coral)}
.brand .count{margin-left:auto; font-size:12.5px; color:var(--muted); font-weight:700;
  background:var(--surface); border:1px solid var(--line); padding:4px 10px; border-radius:999px}
.searchbar{position:relative; margin-bottom:10px}
.searchbar input{
  width:100%; border:1.5px solid var(--line2); background:var(--surface);
  border-radius:999px; padding:12px 16px 12px 42px; font-family:var(--body);
  font-size:16px; color:var(--ink); outline:none; transition:border-color .15s, box-shadow .15s;
}
.searchbar input:focus{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft)}
.searchbar .ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); font-size:16px; opacity:.55}
.searchbar .clr{position:absolute; right:8px; top:50%; transform:translateY(-50%);
  border:none; background:var(--line); color:var(--ink); width:26px; height:26px; border-radius:50%;
  font-size:15px; cursor:pointer; display:none}
.searchbar .clr.show{display:block}

/* TABS */
nav.tabs{display:flex; gap:6px; padding:0 0 10px; overflow-x:auto; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1.5px solid var(--line2); background:var(--surface);
  color:var(--muted); font-family:var(--body); font-weight:800; font-size:14px;
  padding:9px 15px; border-radius:999px; cursor:pointer; display:flex; gap:7px; align-items:center;
  transition:all .15s; white-space:nowrap;
}
.tab .em{font-size:15px}
.tab[aria-selected="true"]{background:var(--teal); border-color:var(--teal); color:#fff; box-shadow:0 3px 10px rgba(14,124,123,.28)}

/* CHIPS */
.chips{display:flex; gap:7px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; border:1.5px solid var(--line2); background:var(--surface);
  color:var(--muted); font-weight:700; font-size:13px; padding:7px 13px; border-radius:999px;
  cursor:pointer; white-space:nowrap; transition:all .12s;
}
.chip[aria-pressed="true"]{background:var(--coral-soft); border-color:var(--coral); color:var(--coral)}

/* PAGES */
main{padding:6px 0 90px}
.page{display:none; animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
.sect-h{font-family:var(--disp); font-weight:600; font-size:15px; color:var(--muted);
  margin:22px 2px 10px; display:flex; align-items:center; gap:8px}
.sect-h::after{content:""; flex:1; height:1px; background:var(--line)}

/* VOCAB GRID */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.wcard{
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r);
  padding:14px 12px 12px; cursor:pointer; position:relative; text-align:left;
  transition:transform .12s, box-shadow .12s, border-color .12s; box-shadow:var(--shadow);
}
.wcard:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--teal-soft)}
.wcard:active{transform:scale(.98)}
.wcard .emo{font-size:30px; line-height:1; display:block; margin-bottom:8px}
.wcard .en{font-weight:800; font-size:16.5px; color:var(--teal-d); letter-spacing:-.01em}
.wcard .fr{font-size:13.5px; color:var(--muted); margin-top:2px; font-weight:600}
.wcard .spk{position:absolute; top:10px; right:10px; font-size:14px; opacity:.4}
.wcard:hover .spk{opacity:.8}

/* VERBS */
.vlist{display:flex; flex-direction:column; gap:8px}
.vrow{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-sm); box-shadow:var(--shadow); overflow:hidden}
.vhead{display:flex; align-items:center; gap:12px; padding:13px 14px; cursor:pointer}
.vhead .vb{font-weight:800; font-size:17px; color:var(--teal-d)}
.vhead .vfr{color:var(--muted); font-size:14px; font-weight:600}
.vhead .vfr .arrow{color:var(--faint); margin:0 6px}
.badge{font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.03em}
.badge.irr{background:var(--coral-soft); color:var(--coral)}
.badge.reg{background:var(--teal-soft); color:var(--teal-d)}
.vhead .chev{margin-left:auto; color:var(--faint); font-size:13px; transition:transform .2s; font-weight:800}
.vrow.open .chev{transform:rotate(180deg)}
.vbody{display:none; padding:0 14px 14px; border-top:1px solid var(--line)}
.vrow.open .vbody{display:block}
.principal{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.pp{background:var(--surface2); border:1px solid var(--line2); border-radius:8px; padding:6px 10px; font-size:13px}
.pp b{color:var(--ink); font-weight:800}
.pp span{color:var(--faint); font-size:11px; display:block; font-weight:700; text-transform:uppercase; letter-spacing:.03em}
.ctable{width:100%; border-collapse:collapse; margin-top:6px; font-size:14px}
.ctable th{text-align:left; font-family:var(--disp); font-weight:600; font-size:13px; color:var(--coral);
  padding:10px 6px 4px; border-bottom:1.5px solid var(--line2)}
.ctable td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.ctable td.pron{color:var(--muted); font-weight:700; font-size:12.5px; width:78px}
.ctable td.form{color:var(--ink); font-weight:600}
.ctable td.form b{color:var(--teal-d); font-weight:800}
.tense-spk{border:none; background:none; cursor:pointer; font-size:13px; opacity:.45; padding:2px 4px}
.tense-spk:hover{opacity:.9}

/* EXPRESSIONS */
.elist{display:flex; flex-direction:column; gap:9px}
.ecard{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-sm);
  padding:13px 14px; box-shadow:var(--shadow); display:flex; align-items:center; gap:13px; cursor:pointer; transition:transform .1s}
.ecard:active{transform:scale(.99)}
.ecard .eemo{font-size:24px; flex:0 0 auto}
.ecard .etxt{flex:1; min-width:0}
.ecard .een{font-weight:800; color:var(--teal-d); font-size:15.5px}
.ecard .efr{color:var(--muted); font-size:13.5px; font-weight:600; margin-top:1px}
.ecard .espk{font-size:15px; opacity:.4; flex:0 0 auto}

/* FLASHCARDS */
.fc-setup{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
.fc-setup label{display:block; font-weight:800; font-size:13px; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.03em}
.fc-setup select{width:100%; padding:11px 13px; border:1.5px solid var(--line2); border-radius:10px; font-family:var(--body); font-size:15px; font-weight:700; color:var(--ink); background:var(--surface); margin-bottom:14px}
.seg{display:flex; gap:6px; margin-bottom:14px}
.seg button{flex:1; padding:10px; border:1.5px solid var(--line2); background:var(--surface); border-radius:10px; font-family:var(--body); font-weight:800; font-size:13.5px; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal-soft); border-color:var(--teal); color:var(--teal-d)}
.btn{width:100%; padding:14px; border:none; border-radius:12px; font-family:var(--body); font-weight:800; font-size:16px; cursor:pointer; background:var(--teal); color:#fff; box-shadow:0 4px 14px rgba(14,124,123,.3)}
.btn:active{transform:scale(.99)}
.fc-stage{display:none}
.fc-stage.on{display:block}
.fc-progress{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px; font-weight:800; color:var(--muted)}
.fc-bar{height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px}
.fc-bar i{display:block; height:100%; background:var(--teal); border-radius:99px; transition:width .3s}
.flashcard{
  background:var(--surface); border:2px solid var(--line); border-radius:24px; min-height:230px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  padding:30px 24px; cursor:pointer; box-shadow:var(--shadow-lg); position:relative; user-select:none;
}
.flashcard .femo{font-size:54px; margin-bottom:14px}
.flashcard .fmain{font-family:var(--disp); font-weight:700; font-size:32px; color:var(--teal-d); letter-spacing:-.02em}
.flashcard .fsub{margin-top:10px; font-size:17px; color:var(--muted); font-weight:700; min-height:24px}
.flashcard .ftip{position:absolute; bottom:14px; font-size:12px; color:var(--faint); font-weight:700}
.flashcard .fspk{position:absolute; top:14px; right:16px; font-size:18px; opacity:.5; border:none; background:none; cursor:pointer}
.fc-actions{display:flex; gap:10px; margin-top:16px}
.fc-actions button{flex:1; padding:14px; border:none; border-radius:12px; font-family:var(--body); font-weight:800; font-size:15px; cursor:pointer}
.fc-actions .again{background:var(--coral-soft); color:var(--coral)}
.fc-actions .know{background:var(--teal); color:#fff}
.fc-done{text-align:center; padding:30px 20px}
.fc-done .big{font-size:50px}
.fc-done h3{font-family:var(--disp); font-size:24px; color:var(--teal-d); margin:10px 0 6px}
.fc-done p{color:var(--muted); font-weight:600; margin:0 0 18px}

.empty{text-align:center; color:var(--faint); padding:50px 20px; font-weight:700}
.empty .be{font-size:40px; display:block; margin-bottom:10px}
footer.foot{text-align:center; color:var(--faint); font-size:12px; font-weight:600; padding:24px 0 40px}
@media(max-width:420px){
  .grid{grid-template-columns:repeat(auto-fill, minmax(135px,1fr))}
  .brand h1{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Mon Anglais<span class="dot">.</span></h1>
      <span class="count" id="totalCount">…</span>
    </div>
    <div class="searchbar">
      <span class="ic">🔎</span>
      <input id="search" type="search" placeholder="Rechercher un mot, un verbe…" autocomplete="off" spellcheck="false">
      <button class="clr" id="clearBtn" aria-label="Effacer">✕</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-page="vocab"><span class="em">📚</span>Vocabulaire</button>
      <button class="tab" role="tab" aria-selected="false" data-page="verbs"><span class="em">🔄</span>Verbes</button>
      <button class="tab" role="tab" aria-selected="false" data-page="expr"><span class="em">💬</span>Expressions</button>
      <button class="tab" role="tab" aria-selected="false" data-page="cards"><span class="em">🃏</span>Cartes</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- VOCAB -->
  <section class="page active" id="page-vocab">
    <div class="chips" id="chips"></div>
    <div id="vocabContent"></div>
  </section>

  <!-- VERBS -->
  <section class="page" id="page-verbs">
    <div class="vlist" id="verbsContent"></div>
  </section>

  <!-- EXPRESSIONS -->
  <section class="page" id="page-expr">
    <div id="exprContent"></div>
  </section>

  <!-- CARDS -->
  <section class="page" id="page-cards">
    <div class="fc-setup" id="fcSetup">
      <label>Choisis un thème</label>
      <select id="fcDeck"></select>
      <label>Sens d'affichage</label>
      <div class="seg" id="fcDir">
        <button data-dir="en" aria-pressed="true">🇬🇧 Anglais → Français</button>
        <button data-dir="fr" aria-pressed="false">🇫🇷 Français → Anglais</button>
      </div>
      <button class="btn" id="fcStart">Commencer les cartes 🎴</button>
    </div>
    <div class="fc-stage" id="fcStage">
      <div class="fc-progress"><span id="fcPos">1 / 20</span><span id="fcKnown">✅ 0</span></div>
      <div class="fc-bar"><i id="fcBar" style="width:0%"></i></div>
      <div class="flashcard" id="flashcard">
        <button class="fspk" id="fcSpk" aria-label="Écouter">🔊</button>
        <div class="femo" id="fcEmo">🎴</div>
        <div class="fmain" id="fcMain">—</div>
        <div class="fsub" id="fcSub"></div>
        <div class="ftip" id="fcTip">Touche la carte pour retourner</div>
      </div>
      <div class="fc-actions">
        <button class="again" id="fcAgain">↻ À revoir</button>
        <button class="know" id="fcKnowBtn">✓ Je sais</button>
      </div>
    </div>
    <div class="fc-done" id="fcDone" style="display:none">
      <div class="big">🎉</div>
      <h3 id="fcDoneTitle">Bravo !</h3>
      <p id="fcDoneMsg"></p>
      <button class="btn" id="fcRestart">Recommencer</button>
    </div>
  </section>

  <footer class="foot">Touche un mot pour l'entendre 🔊 · Conjugaisons générées automatiquement</footer>
</main>

/* ============ AUDIO (prononciation anglaise) ============ */
let enVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v=>/en[-_]GB/i.test(v.lang)) ||
            vs.find(v=>/en[-_]US/i.test(v.lang)) ||
            vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = enVoice ? enVoice.lang : 'en-US';
  if(enVoice) u.voice = enVoice;
  u.rate = .92;
  speechSynthesis.speak(u);
}

/* ============ ONGLETS ============ */
const tabs = document.getElementById('tabs');
tabs.addEventListener('click', e=>{
  const b = e.target.closest('.tab'); if(!b) return;
  activeTab = b.dataset.page;
  [...tabs.children].forEach(t=>t.setAttribute('aria-selected', t===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+activeTab).classList.add('active');
  const sb = document.getElementById('search');
  sb.placeholder = activeTab==='verbs' ? 'Rechercher un verbe…'
                 : activeTab==='expr' ? 'Rechercher une expression…'
                 : activeTab==='cards' ? 'Recherche désactivée en mode cartes'
                 : 'Rechercher un mot…';
  render();
});

const searchEl = document.getElementById('search');
const clearBtn = document.getElementById('clearBtn');
searchEl.addEventListener('input', ()=>{
  query = searchEl.value.trim();
  clearBtn.classList.toggle('show', query.length>0);
  render();
});
clearBtn.addEventListener('click', ()=>{ searchEl.value=''; query=''; clearBtn.classList.remove('show'); render(); searchEl.focus(); });

/* ============ CHIPS CATÉGORIES ============ */
const chipsEl = document.getElementById('chips');
function buildChips(){
  const all = ['Tous', ...CATS];
  chipsEl.innerHTML = all.map(c=>
    `<button class="chip" data-cat="${c}" aria-pressed="${c===activeCat}">${c}</button>`).join('');
}
chipsEl.addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  activeCat = c.dataset.cat;
  [...chipsEl.children].forEach(ch=>ch.setAttribute('aria-pressed', ch.dataset.cat===activeCat));
  renderVocab();
});

/* ============ RENDU VOCAB ============ */
function vocabCard(w){
  return `<button class="wcard" onclick="speak('${esc(w.en)}')">
    <span class="spk">🔊</span>
    <span class="emo">${w.emo}</span>
    <span class="en">${w.en}</span>
    <span class="fr">${w.fr}</span>
  </button>`;
}
const esc = s => s.replace(/'/g,"\\'").replace(/"/g,'&quot;');
function renderVocab(){
  const c = document.getElementById('vocabContent');
  let list = VOCAB_FLAT;
  if(activeCat!=='Tous') list = list.filter(w=>w.cat===activeCat);
  if(query){ const q=norm(query); list = list.filter(w=>norm(w.en).includes(q)||norm(w.fr).includes(q)); }
  if(!list.length){ c.innerHTML = emptyMsg('Aucun mot trouvé'); return; }
  if(query || activeCat!=='Tous'){
    c.innerHTML = `<div class="grid">${list.map(vocabCard).join('')}</div>`;
  } else {
    // regroupé par catégorie
    c.innerHTML = CATS.map(cat=>{
      const items = VOCAB[cat];
      return `<div class="sect-h">${cat} <span style="font-family:var(--body);font-weight:700;font-size:12px;color:var(--faint);background:none">${items.length}</span></div>
        <div class="grid">${items.map(w=>vocabCard({en:w[0],fr:w[1],emo:w[2]})).join('')}</div>`;
    }).join('');
  }
}

/* ============ CONJUGAISON ============ */
const PRON = [['I','I'],['you','you'],['he / she / it','he'],['we','we'],['they','they']];
function beForm(key,tense){
  if(tense==='pres') return {I:'am',you:'are',he:'is',we:'are',they:'are'}[key];
  if(tense==='past') return {I:'was',you:'were',he:'was',we:'were',they:'were'}[key];
}
function conjugate(v){
  const [base,third,ing,past,pp] = v;
  const isBe = base==='be';
  const haveAux = k => k==='he' ? 'has':'have';
  const beAux   = k => ({I:'am',you:'are',he:'is',we:'are',they:'are'}[k]);
  const tenses = [
    {name:'Présent simple', ex:'I '+base, rows:PRON.map(([lab,k])=>
        [lab, isBe ? `<b>${beForm(k,'pres')}</b>` : (k==='he' ? `<b>${third}</b>` : `<b>${base}</b>`)])},
    {name:'Présent continu', ex:'I am '+ing, rows:PRON.map(([lab,k])=>
        [lab, `${beAux(k)} <b>${ing}</b>`])},
    {name:'Prétérit (passé)', ex:'I '+past, rows:PRON.map(([lab,k])=>
        [lab, isBe ? `<b>${beForm(k,'past')}</b>` : `<b>${past}</b>`])},
    {name:'Present perfect', ex:'I have '+pp, rows:PRON.map(([lab,k])=>
        [lab, `${haveAux(k)} <b>${pp}</b>`])},
    {name:'Futur (will)', ex:'I will '+base, rows:PRON.map(([lab,k])=>
        [lab, `will <b>${base}</b>`])},
    {name:'Conditionnel (would)', ex:'I would '+base, rows:PRON.map(([lab,k])=>
        [lab, `would <b>${base}</b>`])},
  ];
  return tenses;
}
const strip = h => h.replace(/<[^>]+>/g,'');
function verbRow(v,i){
  const [base,third,ing,past,pp,fr,irr] = v;
  const tenses = conjugate(v);
  const tables = tenses.map(t=>`
    <div class="sect-h" style="margin:16px 2px 4px">${t.name}
      <button class="tense-spk" onclick="event.stopPropagation();speak('${esc(strip(t.rows.map(r=>r[0].split(' ')[0]+' '+r[1]).join(', ')))}')">🔊</button>
    </div>
    <table class="ctable"><tbody>
      ${t.rows.map(r=>`<tr><td class="pron">${r[0]}</td><td class="form">${r[1]}</td></tr>`).join('')}
    </tbody></table>`).join('');
  return `<div class="vrow" data-i="${i}">
    <div class="vhead" onclick="toggleVerb(this)">
      <span class="vb">${base}</span>
      <span class="vfr">${fr}</span>
      <span class="badge ${irr?'irr':'reg'}">${irr?'irrégulier':'régulier'}</span>
      <span class="chev">▾</span>
    </div>
    <div class="vbody">
      <div class="principal">
        <div class="pp"><span>base</span><b>${base}</b></div>
        <div class="pp"><span>il/elle</span><b>${third}</b></div>
        <div class="pp"><span>-ing</span><b>${ing}</b></div>
        <div class="pp"><span>prétérit</span><b>${past}</b></div>
        <div class="pp"><span>participe</span><b>${pp}</b></div>
        <button class="pp" style="cursor:pointer;background:var(--teal-soft);border-color:var(--teal)" onclick="event.stopPropagation();speak('${esc(base)}')">🔊 écouter</button>
      </div>
      ${tables}
    </div>
  </div>`;
}
function toggleVerb(h){ h.parentElement.classList.toggle('open'); }
function renderVerbs(){
  const c = document.getElementById('verbsContent');
  let list = VERBS.map((v,i)=>({v,i}));
  if(query){ const q=norm(query); list = list.filter(o=>norm(o.v[0]).includes(q)||norm(o.v[5]).includes(q)); }
  if(!list.length){ c.innerHTML = emptyMsg('Aucun verbe trouvé'); return; }
  c.innerHTML = list.map(o=>verbRow(o.v,o.i)).join('');
}

/* ============ EXPRESSIONS ============ */
function exprCard(en,fr,emo){
  return `<button class="ecard" onclick="speak('${esc(en)}')">
    <span class="eemo">${emo}</span>
    <span class="etxt"><span class="een">${en}</span><span class="efr">${fr}</span></span>
    <span class="espk">🔊</span>
  </button>`;
}
function renderExpr(){
  const c = document.getElementById('exprContent');
  const q = query?norm(query):null;
  let idioms = IDIOMS, conns = CONNECTORS;
  if(q){
    idioms = idioms.filter(x=>norm(x[0]).includes(q)||norm(x[1]).includes(q));
    conns = conns.filter(x=>norm(x[0]).includes(q)||norm(x[1]).includes(q));
  }
  let html = '';
  if(idioms.length){
    html += `<div class="sect-h">Expressions idiomatiques</div><div class="elist">`;
    html += idioms.map(x=>exprCard(x[0],x[1],x[2])).join('');
    html += `</div>`;
  }
  if(conns.length){
    const groups = {};
    conns.forEach(x=>{ (groups[x[2]] = groups[x[2]]||[]).push(x); });
    html += `<div class="sect-h">Connecteurs de conversation</div>`;
    for(const g in groups){
      html += `<div class="sect-h" style="font-size:13px;color:var(--coral);margin:14px 2px 8px">${g}</div><div class="elist">`;
      html += groups[g].map(x=>exprCard(x[0],x[1],'🔗')).join('');
      html += `</div>`;
    }
  }
  if(!html) html = emptyMsg('Aucune expression trouvée');
  c.innerHTML = html;
}

/* ============ CARTES MÉMOIRE ============ */
let deck=[], dPos=0, dKnown=0, flipped=false, dDir='en';
function buildDeckOptions(){
  const sel = document.getElementById('fcDeck');
  let opts = `<option value="__all">⭐ Tout le vocabulaire (${VOCAB_FLAT.length})</option>`;
  CATS.forEach(c=> opts += `<option value="cat:${c}">${c} (${VOCAB[c].length})</option>`);
  opts += `<option value="__verbs">🔄 Les 100 verbes</option>`;
  opts += `<option value="__idioms">💬 Expressions idiomatiques (${IDIOMS.length})</option>`;
  sel.innerHTML = opts;
}
function makeDeck(val){
  let arr;
  if(val==='__all') arr = VOCAB_FLAT.map(w=>({emo:w.emo,en:w.en,fr:w.fr}));
  else if(val==='__verbs') arr = VERBS.map(v=>({emo:'🔄',en:v[0],fr:v[5]}));
  else if(val==='__idioms') arr = IDIOMS.map(x=>({emo:x[2],en:x[0],fr:x[1]}));
  else { const cat=val.slice(4); arr = VOCAB[cat].map(w=>({emo:w[2],en:w[0],fr:w[1]})); }
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
document.getElementById('fcDir').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  dDir=b.dataset.dir;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
});
document.getElementById('fcStart').addEventListener('click', startDeck);
function startDeck(){
  deck = makeDeck(document.getElementById('fcDeck').value);
  dPos=0; dKnown=0; flipped=false;
  document.getElementById('fcSetup').style.display='none';
  document.getElementById('fcDone').style.display='none';
  document.getElementById('fcStage').classList.add('on');
  showCard();
}
function showCard(){
  if(dPos>=deck.length){ finishDeck(); return; }
  flipped=false;
  const card = deck[dPos];
  document.getElementById('fcEmo').textContent = card.emo;
  document.getElementById('fcMain').textContent = dDir==='en'?card.en:card.fr;
  document.getElementById('fcSub').textContent = '';
  document.getElementById('fcTip').textContent = 'Touche la carte pour retourner';
  document.getElementById('fcPos').textContent = (dPos+1)+' / '+deck.length;
  document.getElementById('fcKnown').textContent = '✅ '+dKnown;
  document.getElementById('fcBar').style.width = (dPos/deck.length*100)+'%';
  if(dDir==='en') speak(card.en);
}
function flipCard(){
  const card = deck[dPos]; if(!card) return;
  flipped=!flipped;
  document.getElementById('fcSub').textContent = flipped ? (dDir==='en'?card.fr:card.en) : '';
  document.getElementById('fcTip').textContent = flipped ? '' : 'Touche la carte pour retourner';
  if(flipped && dDir==='fr') speak(card.en);
}
document.getElementById('flashcard').addEventListener('click', e=>{ if(e.target.id==='fcSpk') return; flipCard(); });
document.getElementById('fcSpk').addEventListener('click', e=>{ e.stopPropagation(); const c=deck[dPos]; if(c) speak(c.en); });
document.getElementById('fcKnowBtn').addEventListener('click', ()=>{ dKnown++; dPos++; showCard(); });
document.getElementById('fcAgain').addEventListener('click', ()=>{ const c=deck[dPos]; deck.splice(dPos,1); deck.push(c); showCard(); });
function finishDeck(){
  document.getElementById('fcStage').classList.remove('on');
  document.getElementById('fcDone').style.display='block';
  document.getElementById('fcBar').style.width='100%';
  document.getElementById('fcDoneMsg').textContent = `Tu as révisé ${deck.length} cartes. Bien joué !`;
}
document.getElementById('fcRestart').addEventListener('click', ()=>{
  document.getElementById('fcDone').style.display='none';
  document.getElementById('fcSetup').style.display='block';
});

/* ============ HELPERS RENDU ============ */
function emptyMsg(t){ return `<div class="empty"><span class="be">🔍</span>${t}</div>`; }
function render(){
  document.getElementById('search').disabled = (activeTab==='cards');
  if(activeTab==='vocab') renderVocab();
  else if(activeTab==='verbs') renderVerbs();
  else if(activeTab==='expr') renderExpr();
}

/* ============ INIT ============ */
buildChips();
buildDeckOptions();
render();
</script>
</body>
</html>
